version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - "area: ci"
      - "type: chore"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - "area: backend"
      - "type: chore"
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - "area: frontend"
      - "type: chore"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
