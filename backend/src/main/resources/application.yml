spring:
  application:
    name: pokenexus-backend
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pokenexus}
    username: ${DB_USERNAME:pokenexus}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

app:
  ingestion:
    enabled: false
    csv-dir: ../data/csv
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  team:
    save-limit-per-minute: 10

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    com.pokenexus: INFO
    org.springframework.boot.web: INFO
